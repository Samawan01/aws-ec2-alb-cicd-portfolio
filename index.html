<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Cloud & SysOps Portfolio Project</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; text-align: center; padding: 50px; }
        .container { max-width: 700px; margin: auto; background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 1.1em; }
        .badge-container { margin-top: 30px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .badge { background: #334155; color: #38bdf8; padding: 10px 18px; border-radius: 20px; font-weight: bold; font-size: 0.9em; border: 1px solid #475569; }
        .footer { margin-top: 40px; font-size: 0.85em; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AWS Cloud Infrastructure & CI/CD Pipeline</h1>
        <p>Successfully deployed, automated, and scaled via S3, EC2, and Application Load Balancer.</p>
        
        <div class="badge-container">
            <span class="badge">Amazon S3 (Storage)</span>
            <span class="badge">AWS EC2 (RHEL Compute)</span>
            <span class="badge">Application Load Balancer</span>
            <span class="badge">Automated CI/CD Script</span>
        </div>

        <div class="footer">
            <p>Project Architecture Operational • Region: ap-southeast-2</p>
        </div>
    </div>
</body>
</html>
